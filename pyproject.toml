[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vinylpilot"
version = "0.2.2"
description = "USB turntable streamer for Music Assistant (Sendspin source) and Home Assistant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  # Pinned to the version Music Assistant 2.10.12 ships with.
  "aiosendspin[source]==10.2.1",
  "numpy>=1.26",
  "aiomqtt>=2.3,<3",
]

[project.optional-dependencies]
# Track recognition via the unofficial Shazam API (installed by default by the installer)
shazam = ["shazamio==0.9.0"]
# "server" pulls in the aiosendspin test server for the end-to-end test
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosendspin[server]==10.2.1"]

[project.scripts]
vinylpilot = "vinylpilot.__main__:main"
vinylpilot-web = "vinylpilot.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vinylpilot = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
